<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <main>
      <h1>Tetris Game</h1>
      <p>Chọn level để bắt đầu chơi:</p>

      <div class="levels" aria-label="Chọn cấp độ">
        <button class="level-button" data-level="1">Level 1</button>
        <button class="level-button" data-level="2">Level 2</button>
        <button class="level-button" data-level="3">Level 3</button>
        <button class="level-button" data-level="4">Level 4</button>
        <button class="level-button" data-level="5">Level 5</button>
      </div>
    </main>
    <section id="game" hidden>
      <h2>Game Area <span id="current-level">Level 1</span></h2>
      <div class="game-layout">
        <div id="game-board" aria-label="Bảng trò chơi"></div>
        <aside class="game-info">
          <div class="info">
            <h3>MỤC TIÊU</h3>
            <p id="goal-text">Xóa 5 hàng để thắng</p>
            <p id="goal-progress" aria-live="polite">0 / 5 hàng</p>
          </div>

          <div class="info">
            <h3>KHỐI TIẾP THEO</h3>
            <div id="next-shape"></div>
          </div>
        </aside>
      </div>
      <button id="return-button">Chọn lại level</button>
    </section>
  </body>
  <script src="./js/app.js"></script>
</html>
