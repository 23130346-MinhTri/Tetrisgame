<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      * {
        box-sizing: border-box;
        padding: 0;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #e2dcdc;
        font-family: Arial, sans-serif;
        color: #000;
      }
      main {
        width: min(100% - 32px, 520px);
        padding: 40px 24px;
        text-align: center;
      }
      h1 {
        margin: 0 0 16px;
        color: #38bdf8;
        font-size: 48px;
        letter-spacing: 6px;
      }
      p {
        margin: 0 0 28px;
        color: #000;
        font-size: 18px;
      }
      .levels {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
      }
      .level-button {
        width: 100px;
        height: 72px;
        border: 2px solid #38bdf8;
        border-radius: 12px;
        background: #1e293b;
        color: #fff;
        font-size: 24px;
        font-weight: bold;
        cursor: pointer;
        transition:
          background 0.3s,
          transform 0.3s;
      }
      .level-button:hover {
        background: #38bdf8;
        transform: scale(1.05);
      }
      .level-button:focus-visible {
        outline: 2px solid #38bdf8;
        outline-offset: 4px;
      }

      [hidden] {
        display: none !important;
      }
      #game {
        padding: 20px;
        text-align: center;
      }
      .game-layout {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        gap: 24px;
        margin: 20px 0;
      }
      .game-layout #game-board {
        margin: 0;
        flex-shrink: 0;
      }
      .game-info {
        display: flex;
        flex-direction: column;
        gap: 16px;
        width: 180px;
      }
      .info {
        padding: 16px;
        border: 1px solid #475569;
        border-radius: 10px;
        background: #000;
        color: #fff;
        text-align: center;
      }
      .info h3 {
        margin: 0 0 12px;
        color: #38bdf8;
        font-size: 15px;
      }
      .info p {
        margin: 8px 0;
        font-size: 16px;
        color: #fff;
      }
      #goal-progress {
        color: #facc15;
        font-size: 22px;
        font-weight: bold;
      }
      #next-shape {
        display: grid;
        grid-auto-rows: 30px;
        gap: 0;
        justify-content: center;
        align-content: center;
        min-height: 120px;
      }
      #next-shape .preview-cell {
        width: 30px;
        height: 30px;
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }

      #next-shape .preview-cell.filled {
        border: 1px solid rgba(255, 255, 255, 0.5);
      }
      #game h2 {
        color: #38bdf8;
        font-size: 22px;
      }
      #game-board {
        display: grid;
        grid-template-columns: repeat(10, 1fr);
        width: min(300px, 85vw);
        margin: 20px auto;
        border: 2px solid #000;
        background: #fff;
      }
      .cell {
        aspect-ratio: 1;
        border: 1px solid #000;
      }
      .cell.filled {
        background: #38bdf8;
        border-color: #ccc;
      }
      #return-button {
        padding: 12px 20px;
        border: none;
        border-radius: 8px;
        background: #334155;
        color: #fff;
        font-size: 16px;
        cursor: pointer;
      }
      .cell.obstacle {
        background: #64748b !important;
        border: 2px solid #cbd5e1;
      }
      .cell.time-bonus {
        outline: 2px solid #4ade80;
        outline-offset: -2px;
        color: #4ade80;
        display: grid;
        place-items: center;
        font-size: 12px;
        font-weight: bold;
      }
      #time {
        color: #facc15;
      }
      .bomb-cell {
        display: grid;
        place-items: center;
        background-color: #f97316 !important;
        font-size: 20px;
        line-height: 1;
      }
      .cell.garbage-cell {
        border-color: #94a3b8;

        background-image: repeating-linear-gradient(
          135deg,
          transparent 0,
          transparent 6px,
          rgba(0, 0, 0, 0.2) 6px,
          rgba(0, 0, 0, 0.2) 9px
        );
      }
      .cell.ice-cell {
        display: flex;
        align-items: center;
        justify-content: center;

        color: #075985;
        font-size: 20px;
        font-weight: bold;

        box-shadow: inset 0 0 0 2px #ecfeff;
        text-shadow: 0 0 4px white;
      }
      .guide-button {
        display: inline-block;
        margin-top: 20px;
        padding: 12px 24px;
        border-radius: 8px;
        background-color: #2563eb;
        color: white;
        font-size: 16px;
        font-weight: bold;
        text-decoration: none;
      }

      .guide-button:hover {
        background-color: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Tetris Game</h1>
      <p>Chọn level để bắt đầu chơi:</p>

      <div class="levels" aria-label="Chọn cấp độ">
        <button class="level-button" data-level="1">Level 1</button>
        <button class="level-button" data-level="2">Level 2</button>
        <button class="level-button" data-level="3">Level 3</button>
        <button class="level-button" data-level="4">Level 4</button>
        <button class="level-button" data-level="5">Level 5</button>
      </div>
      <a
        class="guide-button"
        href="https://docs.google.com/document/d/1SXRY98tPAGeVJ6s1N4F7XxUY8fWAXiw3/edit?usp=sharing"
        target="_blank"
        rel="noopener noreferrer"
      >
        Hướng dẫn chơi
      </a>
    </main>
    <section id="game" hidden>
      <h2>Game Area <span id="current-level">Level 1</span></h2>
      <div class="game-layout">
        <div id="game-board" aria-label="Bảng trò chơi"></div>
        <aside class="game-info">
          <div class="info">
            <h3>MỤC TIÊU</h3>
            <p id="goal-text">Xóa 5 hàng để thắng</p>
            <p id="goal-progress" aria-live="polite">0 / 5 hàng</p>
          </div>
          <div id="game-stats" class="info">
            <h3>THÔNG TIN</h3>
            <p>Điểm: <strong id="score">0</strong></p>
            <p id="time-row" hidden>
              Thời gian: <strong id="time">0</strong> giây
            </p>
          </div>
          <div class="info">
            <h3>KHỐI TIẾP THEO</h3>
            <div id="next-shape"></div>
          </div>
        </aside>
      </div>
      <button id="return-button">Chọn lại level</button>
    </section>
  </body>
  <script src="game.js"></script>
</html>
